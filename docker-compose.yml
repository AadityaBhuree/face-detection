version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── PostgreSQL (Primary Database) ───────────────────────────
  # pgvector/pgvector:pg16 ships the `vector` extension needed for
  # face-embedding vectors (stock postgres:16-alpine does not include it).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jeevandata-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jeevandata
      POSTGRES_PASSWORD: jeevandata_secret
      POSTGRES_DB: jeevandata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeevandata -d jeevandata"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Redis (Session State + BullMQ Queue) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: jeevandata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis_secret
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Qdrant (Vector Database for Face Embeddings) ────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: jeevandata-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ""
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging

  # ─── MinIO (Local S3-compatible / R2-equivalent Storage) ─────
  minio:
    image: minio/minio:latest
    container_name: jeevandata-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: auto
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── MinIO Bucket Initializer ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: jeevandata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/jeevandata-media --ignore-existing &&
      mc anonymous set download local/jeevandata-media &&
      mc policy set public local/jeevandata-media &&
      echo 'MinIO buckets initialized successfully'
      "
    logging: *default-logging

  # ─── Whisper Server (STT) ───────────────────────────────────
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:server-latest
    container_name: jeevandata-whisper
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - whisper-models:/models
    environment:
      WHISPER_MODEL: base
      WHISPER_LANGUAGE: en
      WHISPER_N_THREADS: 4
    command: >
      --port 9001
      --model /models/ggml-base.bin
      --host 0.0.0.0
      --convert
    logging: *default-logging

  # ─── Redis Commander (Admin UI — dev only) ──────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jeevandata-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_secret
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - devtools
    logging: *default-logging

  # ─── Prometheus (Metrics Scraper — Phase 7.6) ───────────────
  # Scrapes the backend's GET /metrics. The backend runs on the Docker
  # host in this stack, so we reach it via host.docker.internal:4000
  # (the extra_hosts host-gateway mapping makes that resolve on Linux).
  # If the backend is containerized later, point the target at its DNS
  # name instead (see monitoring/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jeevandata-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/rules/jeevandata-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Alertmanager (Alert Routing — Phase 7.6) ───────────────
  # Receives fired alerts from Prometheus and notifies Slack via webhook.
  # The placeholder webhook URL keeps the container bootable; replace
  # SLACK_WEBHOOK_URL in your environment/.env with a real incoming webhook
  # to enable Slack delivery. Alerts are always visible in the UI (:9093).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: jeevandata-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/REPLACE_ME}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Grafana (Dashboards — Phase 7.6) ───────────────────────
  # Datasource + dashboards are auto-provisioned from ./monitoring/grafana.
  # Default login: admin / ${GF_ADMIN_PASSWORD:-admin} — set GF_ADMIN_PASSWORD
  # in your environment (or .env) before deploying anywhere shared.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: jeevandata-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-storage:
    driver: local
  minio-data:
    driver: local
  whisper-models:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
