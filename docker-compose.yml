version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── PostgreSQL (Primary Database) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ayutalk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ayutalk
      POSTGRES_PASSWORD: ayutalk_secret
      POSTGRES_DB: ayutalk_care
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayutalk -d ayutalk_care"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Redis (Session State + BullMQ Queue) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: ayutalk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis_secret
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Qdrant (Vector Database for Face Embeddings) ────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: ayutalk-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ""
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging

  # ─── MinIO (Local S3-compatible / R2-equivalent Storage) ─────
  minio:
    image: minio/minio:latest
    container_name: ayutalk-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: auto
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── MinIO Bucket Initializer ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: ayutalk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/ayutalk-media --ignore-existing &&
      mc anonymous set download local/ayutalk-media &&
      mc policy set public local/ayutalk-media &&
      echo 'MinIO buckets initialized successfully'
      "
    logging: *default-logging

  # ─── Whisper Server (STT) ───────────────────────────────────
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:server-latest
    container_name: ayutalk-whisper
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - whisper-models:/models
    environment:
      WHISPER_MODEL: base
      WHISPER_LANGUAGE: en
      WHISPER_N_THREADS: 4
    command: >
      --port 9001
      --model /models/ggml-base.bin
      --host 0.0.0.0
      --convert
    logging: *default-logging

  # ─── Redis Commander (Admin UI — dev only) ──────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ayutalk-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_secret
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - devtools
    logging: *default-logging

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-storage:
    driver: local
  minio-data:
    driver: local
  whisper-models:
    driver: local
