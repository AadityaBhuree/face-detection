# Alertmanager configuration for Jeevandata.
#
# Sends Prometheus alerts (see monitoring/prometheus-alerts.yml) to Slack
# via an incoming webhook. docker-compose provides SLACK_WEBHOOK_URL with
# a valid placeholder default so Alertmanager always boots; replace it with
# your real incoming-webhook URL to enable delivery:
#
#   export SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T0000/B0000/XXXX
#   docker compose up -d alertmanager
#
# Tip: put SLACK_WEBHOOK_URL in your .env so it is picked up by compose.

global:
  # How long to wait before re-notifying on a still-firing alert.
  resolve_timeout: 5m
  # Fallback Slack channel for notifications (overridable per-route).
  slack_api_url: 'https://hooks.slack.com/services/REPLACE_ME'

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack'
  routes:
    - matchers:
        - severity =~ "critical|warning"
      receiver: 'slack'
      continue: false
    # Default sink for anything not matched above (e.g. info-level).
    - matchers:
        - severity = "info"
      receiver: 'null'

receivers:
  - name: 'slack'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_ME'
        channel: '#jeevandata-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.description }}
          {{ end }}
          Severity: {{ .CommonLabels.severity }} · Environment: {{ .ExternalLabels.environment }}
        icon_emoji: ':hospital:'

  # No-op receiver — alerts are acknowledged silently (used for info-level).
  - name: 'null'
